<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Noodle-Hub Pokédex</title>

<link rel="icon" type="image/png" href="https://thenoodle-hub.github.io/Thenoodlehub1.png">

<link rel="apple-touch-icon" href="https://thenoodle-hub.github.io/Thenoodlehub1.png">
<link rel="apple-touch-icon" sizes="152x152" href="https://thenoodle-hub.github.io/Thenoodlehub1.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://thenoodle-hub.github.io/Thenoodlehub1.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noodle Pokedex">
<meta name="mobile-web-app-capable" content="yes">

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Press Start 2P', cursive;
    min-height:100vh;
    background:linear-gradient(
    135deg,
    #ff6b6b,
    #feca57,
    #48dbfb,
    #5f27cd
    );
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
    color:white;
    padding:20px;
    overflow-x:hidden;
    transition:0.4s;
}

/* DARK THEME */

.dark-theme{
    background:linear-gradient(
    135deg,
    #000000,
    #111827,
    #1e293b,
    #312e81
    ) !important;
}

/* BACKGROUND */

@keyframes bgMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

/* INTRO SCREEN */

#introScreen{
    position:fixed;
    inset:0;
    background:linear-gradient(
    135deg,
    #111827,
    #1e293b,
    #312e81
    );
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    animation:fadeOut 1s ease forwards;
    animation-delay:3s;
}

@keyframes fadeOut{

    to{
        opacity:0;
        visibility:hidden;
    }

}

.intro-content{
    display:flex;
    align-items:center;
    gap:35px;
    flex-wrap:wrap;
    justify-content:center;
    text-align:center;
}

.intro-text h1{
    font-size:2.5rem;
    color:white;
    text-shadow:4px 4px 0px black;
    margin-bottom:15px;
}

.intro-text p{
    font-size:0.8rem;
    color:#dbeafe;
}

/* POKEBALL */

.pokeball{
    width:140px;
    height:140px;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    animation:spin 2s linear infinite;
    box-shadow:0 0 30px rgba(255,255,255,0.5);
}

.top{
    position:absolute;
    width:100%;
    height:50%;
    background:#ff1f1f;
    top:0;
}

.bottom{
    position:absolute;
    width:100%;
    height:50%;
    background:white;
    bottom:0;
}

.middle{
    position:absolute;
    width:100%;
    height:12px;
    background:black;
    top:50%;
    transform:translateY(-50%);
    z-index:2;
}

.center{
    position:absolute;
    width:42px;
    height:42px;
    background:white;
    border:10px solid black;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:3;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

/* CONTAINER */

.container{
    max-width:1500px;
    margin:auto;
}

/* HEADER */

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:3rem;
    margin-bottom:20px;
    text-shadow:5px 5px 0px black;
}

.subtitle{
    margin-bottom:25px;
    font-size:0.7rem;
}

/* SEARCH */

.search-box{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.search-box input{
    width:420px;
    max-width:90%;
    padding:15px;
    border:none;
    border-radius:15px;
    outline:none;
    font-size:0.7rem;
}

.search-box button{
    padding:15px 20px;
    border:none;
    border-radius:15px;
    background:#ff0000;
    color:white;
    cursor:pointer;
    transition:0.2s;
    font-size:0.6rem;
    font-family:'Press Start 2P', cursive;
}

.search-box button:hover{
    transform:scale(1.05);
    background:#cc0000;
}

/* STATS */

.stats-bar{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.stat-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border:2px solid rgba(255,255,255,0.2);
    padding:15px;
    border-radius:20px;
    min-width:170px;
    text-align:center;
}

.stat-box h3{
    font-size:0.7rem;
    margin-bottom:10px;
}

.stat-box p{
    font-size:1rem;
}

/* GENERATION BUTTONS */

.generation-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.gen-btn{
    padding:12px 14px;
    border:none;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
    color:white;
    cursor:pointer;
    transition:0.2s;
    font-family:'Press Start 2P', cursive;
    font-size:0.5rem;
    backdrop-filter:blur(10px);
}

.gen-btn:hover{
    transform:scale(1.05);
    background:#ffffff33;
}

/* POKEMON GRID */

.pokemon-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

.pokemon-card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border:2px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:20px;
    text-align:center;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:0.25s;
}

.pokemon-card::before{
    content:'';
    position:absolute;
    width:220px;
    height:220px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-120px;
    right:-120px;
}

.pokemon-card:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 0 20px rgba(255,255,255,0.4);
}

.pokemon-card:hover img{
    filter:drop-shadow(0 0 10px white);
}

.pokemon-card img{
    width:140px;
    height:140px;
    image-rendering:pixelated;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }

}

.pokemon-id{
    font-size:0.55rem;
    margin-bottom:10px;
    color:#eee;
}

.pokemon-card h3{
    margin:12px 0;
    font-size:0.75rem;
}

/* TYPES */

.type-container{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.type{
    padding:8px 10px;
    border-radius:20px;
    font-size:0.45rem;
    color:white;
}

.fire{background:#f08030;}
.water{background:#6890f0;}
.grass{background:#78c850;}
.electric{background:#f8d030;color:black;}
.psychic{background:#f85888;}
.ice{background:#98d8d8;color:black;}
.dragon{background:#7038f8;}
.dark{background:#705848;}
.fairy{background:#ee99ac;}
.normal{background:#a8a878;}
.fighting{background:#c03028;}
.flying{background:#a890f0;}
.poison{background:#a040a0;}
.ground{background:#e0c068;color:black;}
.rock{background:#b8a038;}
.bug{background:#a8b820;}
.ghost{background:#705898;}
.steel{background:#b8b8d0;color:black;}

/* LOADING */

.loading{
    text-align:center;
    font-size:1rem;
    margin-top:80px;
}

/* MODAL */

.pokemon-details{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
    padding:20px;
}

.hidden{
    display:none;
}

.details-card{
    width:550px;
    max-width:100%;
    background:white;
    color:black;
    border-radius:30px;
    padding:30px;
    position:relative;
    animation:pop 0.3s ease;
}

@keyframes pop{

    from{
        transform:scale(0.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

#closeBtn{
    position:absolute;
    top:15px;
    right:15px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:red;
    color:white;
    cursor:pointer;
    font-size:1rem;
}

.details-card h2{
    text-align:center;
    margin-bottom:20px;
    font-size:1.2rem;
}

.details-image{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.details-image img{
    width:220px;
    height:220px;
}

.info{
    margin-bottom:15px;
    font-size:0.65rem;
    line-height:1.8;
}

/* STATS */

.stats{
    margin-top:20px;
}

.stat{
    margin-bottom:12px;
}

.stat-name{
    font-size:0.55rem;
    margin-bottom:5px;
}

.bar{
    height:18px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:linear-gradient(90deg,#ff0000,#ff9900);
    border-radius:20px;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:12px;
}

::-webkit-scrollbar-track{
    background:#111827;
}

::-webkit-scrollbar-thumb{
    background:#ff0000;
    border-radius:10px;
}

/* MOBILE */

@media(max-width:700px){

    header h1{
        font-size:1.7rem;
    }

    .pokemon-card img{
        width:100px;
        height:100px;
    }

    .intro-text h1{
        font-size:1.5rem;
    }

    .intro-text p{
        font-size:0.6rem;
    }

    .pokeball{
        width:110px;
        height:110px;
    }

}

</style>
</head>

<body>

<div id="introScreen">

    <div class="intro-content">

        <div class="pokeball">

            <div class="top"></div>
            <div class="middle"></div>
            <div class="bottom"></div>
            <div class="center"></div>

        </div>

        <div class="intro-text">

            <h1>The Noodle-Hub</h1>

            <p>Clean • Modern • Pokédex</p>

        </div>

    </div>

</div>

<div class="container">

<header>

<h1>⚡ Ultimate Pokédex ⚡</h1>

<p class="subtitle">
Search • Battle Stats • Shiny Pokémon • Every Generation
</p>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search Pokémon by name or ID..."
>

<button id="randomBtn">
Random
</button>

<button id="themeBtn">
Theme
</button>

<button id="shinyBtn">
Shiny Mode
</button>

</div>

</header>

<div class="stats-bar">

<div class="stat-box">
<h3>Total Pokémon</h3>
<p id="totalPokemon">0</p>
</div>

<div class="stat-box">
<h3>Showing</h3>
<p id="showingPokemon">0</p>
</div>

</div>

<div class="generation-buttons">

<button class="gen-btn" onclick="filterGeneration(1,151)">
Gen 1
</button>

<button class="gen-btn" onclick="filterGeneration(152,251)">
Gen 2
</button>

<button class="gen-btn" onclick="filterGeneration(252,386)">
Gen 3
</button>

<button class="gen-btn" onclick="filterGeneration(387,493)">
Gen 4
</button>

<button class="gen-btn" onclick="filterGeneration(494,649)">
Gen 5
</button>

<button class="gen-btn" onclick="filterGeneration(650,721)">
Gen 6
</button>

<button class="gen-btn" onclick="filterGeneration(722,809)">
Gen 7
</button>

<button class="gen-btn" onclick="filterGeneration(810,905)">
Gen 8
</button>

<button class="gen-btn" onclick="filterGeneration(906,1025)">
Gen 9
</button>

<button class="gen-btn" onclick="displayPokemons(allPokemons)">
All
</button>

</div>

<div id="loading" class="loading">
Loading Pokémon...
</div>

<div id="pokemonList" class="pokemon-list"></div>

</div>

<div id="pokemonDetails" class="pokemon-details hidden">

<div class="details-card">

<button id="closeBtn">✖</button>

<h2 id="pokemonName"></h2>

<div class="details-image">
<img id="pokemonImg" src="">
</div>

<div class="info">
<strong>ID:</strong>
<span id="pokemonId"></span>
</div>

<div class="info">
<strong>Type:</strong>
<span id="pokemonType"></span>
</div>

<div class="info">
<strong>Height:</strong>
<span id="pokemonHeight"></span>
</div>

<div class="info">
<strong>Weight:</strong>
<span id="pokemonWeight"></span>
</div>

<div class="info">
<strong>Abilities:</strong>
<span id="pokemonAbilities"></span>
</div>

<div class="stats" id="pokemonStats"></div>

</div>

</div>

<script>

const pokemonList =
document.getElementById('pokemonList');

const searchInput =
document.getElementById('searchInput');

const pokemonDetails =
document.getElementById('pokemonDetails');

const closeBtn =
document.getElementById('closeBtn');

const randomBtn =
document.getElementById('randomBtn');

const themeBtn =
document.getElementById('themeBtn');

const shinyBtn =
document.getElementById('shinyBtn');

const pokemonName =
document.getElementById('pokemonName');

const pokemonImg =
document.getElementById('pokemonImg');

const pokemonId =
document.getElementById('pokemonId');

const pokemonType =
document.getElementById('pokemonType');

const pokemonHeight =
document.getElementById('pokemonHeight');

const pokemonWeight =
document.getElementById('pokemonWeight');

const pokemonAbilities =
document.getElementById('pokemonAbilities');

const pokemonStats =
document.getElementById('pokemonStats');

const totalPokemon =
document.getElementById('totalPokemon');

const showingPokemon =
document.getElementById('showingPokemon');

const loading =
document.getElementById('loading');

const POKEMON_COUNT = 1025;

let allPokemons = [];

let shinyMode = false;

async function fetchPokemons(){

    loading.style.display = 'block';

    loading.innerHTML =
    "Loading ALL Pokémon...";

    try{

        const response = await fetch(
        `https://pokeapi.co/api/v2/pokemon?limit=${POKEMON_COUNT}`
        );

        const data = await response.json();

        const pokemonPromises =
        data.results.map(async (pokemon) => {

            const res =
            await fetch(pokemon.url);

            return await res.json();

        });

        allPokemons =
        await Promise.all(pokemonPromises);

        displayPokemons(allPokemons);

        totalPokemon.textContent =
        allPokemons.length;

        showingPokemon.textContent =
        allPokemons.length;

        loading.style.display = 'none';

    }

    catch(error){

        loading.innerHTML =
        "Failed to load Pokémon.";

        console.error(error);

    }

}

function displayPokemons(pokemons){

    pokemonList.innerHTML = '';

    pokemons.forEach(pokemon => {

        const card =
        document.createElement('div');

        card.classList.add('pokemon-card');

        const types =
        pokemon.types.map(type => `

            <span class="type ${type.type.name}">
                ${type.type.name}
            </span>

        `).join('');

        card.innerHTML = `

        <div class="pokemon-id">
            #${pokemon.id.toString().padStart(4,'0')}
        </div>

        <img
        loading="lazy"
        src="${
            shinyMode
            ? (
            pokemon.sprites.other['official-artwork']
            .front_shiny ||
            pokemon.sprites.front_shiny
            )
            : (
            pokemon.sprites.other['official-artwork']
            .front_default ||
            pokemon.sprites.front_default
            )
        }"
        alt="${pokemon.name}"
        >

        <h3>
            ${
                pokemon.name.charAt(0)
                .toUpperCase() +
                pokemon.name.slice(1)
            }
        </h3>

        <div class="type-container">
            ${types}
        </div>

        `;

        card.addEventListener('click', () => {

            showDetails(pokemon);

        });

        pokemonList.appendChild(card);

    });

}

function filterGeneration(start,end){

    const filtered =
    allPokemons.filter(pokemon =>

        pokemon.id >= start &&
        pokemon.id <= end

    );

    displayPokemons(filtered);

    showingPokemon.textContent =
    filtered.length;

}

function showDetails(pokemon){

    pokemonDetails.classList.remove('hidden');

    pokemonName.textContent =
    pokemon.name.toUpperCase();

    pokemonImg.src =
    shinyMode
    ? (
    pokemon.sprites.other['official-artwork']
    .front_shiny ||
    pokemon.sprites.front_shiny
    )
    : (
    pokemon.sprites.other['official-artwork']
    .front_default ||
    pokemon.sprites.front_default
    );

    pokemonId.textContent =
    `#${pokemon.id}`;

    pokemonType.textContent =
    pokemon.types
    .map(t => t.type.name)
    .join(', ');

    pokemonHeight.textContent =
    `${pokemon.height / 10} m`;

    pokemonWeight.textContent =
    `${pokemon.weight / 10} kg`;

    pokemonAbilities.textContent =
    pokemon.abilities
    .map(a => a.ability.name)
    .join(', ');

    pokemonStats.innerHTML = '';

    pokemon.stats.forEach(stat => {

        const statDiv =
        document.createElement('div');

        statDiv.classList.add('stat');

        statDiv.innerHTML = `

        <div class="stat-name">
            ${stat.stat.name.toUpperCase()}
            - ${stat.base_stat}
        </div>

        <div class="bar">
            <div
            class="fill"
            style="
            width:${Math.min(stat.base_stat,100)}%
            ">
            </div>
        </div>

        `;

        pokemonStats.appendChild(statDiv);

    });

}

closeBtn.addEventListener('click', () => {

    pokemonDetails.classList.add('hidden');

});

pokemonDetails.addEventListener('click', (e) => {

    if(e.target === pokemonDetails){

        pokemonDetails.classList.add('hidden');

    }

});

searchInput.addEventListener('input', () => {

    const query =
    searchInput.value.toLowerCase();

    const filtered =
    allPokemons.filter(pokemon =>

        pokemon.name.includes(query) ||

        pokemon.id.toString() === query

    );

    displayPokemons(filtered);

    showingPokemon.textContent =
    filtered.length;

});

randomBtn.addEventListener('click', () => {

    const randomPokemon =

    allPokemons[
        Math.floor(
            Math.random() *
            allPokemons.length
        )
    ];

    showDetails(randomPokemon);

});

/* THEME BUTTON */

themeBtn.addEventListener('click', () => {

    document.body.classList.toggle('dark-theme');

});

/* SHINY MODE */

shinyBtn.addEventListener('click', () => {

    shinyMode = !shinyMode;

    displayPokemons(allPokemons);

});

fetchPokemons();

</script>

</body>
</html>
